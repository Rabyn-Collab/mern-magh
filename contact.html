<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
  </head>

  <body>

    <form action="mailto:rabyn900@gmail.com" method="post" enctype="text/plain">


      <p>
        <label for="username">Username</label>
        <input name="username" id="username" type="text" placeholder="username">
      </p>

      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="@example.com">
      </p>

      <p>
      <h3>Select Your Gender</h3>
      <label for="male">Male</label>
      <input type="radio" id="male" name="gender" value="male">

      <label for="female">Female</label>
      <input type="radio" id="female" name="gender" value="female">

      </p>


      <p>
      <h3>Select Your Habits</h3>
      <label for="dance">Dance</label>
      <input type="checkbox" id="dance" name="habits" value="dance">

      <label for="sing">Sing</label>
      <input type="checkbox" id="sing" name="habits" value="sing">

      </p>

      <p>
        <label for="date">Your Join Date</label>
        <input type="date" name="date" id="date">
      </p>

      <p>
      <h3>Select Your Country</h3>
      <select name="country" id="country">
        <option value="nepal">Nepal</option>
        <option value="india">India</option>
        <option value="china">China</option>
      </select>
      </p>

      <p>
        <label for="feedback">Give FeedBack</label>
        <br>
        <textarea name="feedback" id="feedback" rows="10" cols="30"></textarea>
      </p>




      <button type="submit">Submit</button>


    </form>

  </body>

</html>
